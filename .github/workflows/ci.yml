name: CI/CD Pipeline - C2 Command System

on:
  push:
    branches: [ "main", "develop", "feature/*" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test-backend-express:
    name: Backend Express Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-express
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend-express/package-lock.json'
      - run: npm ci
      - run: npm test

  test-backend-fastapi:
    name: Backend FastAPI Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-fastapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: pytest

  test-frontend-react:
    name: Frontend React Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend-react/package-lock.json'
      - run: npm ci
      - run: npm test

  test-frontend-vue:
    name: Frontend Vue 3 Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend-vue/package-lock.json'
      - run: npm ci
      - run: npm test

  docker-build-check:
    name: Docker Build Validation
    needs: [test-backend-express, test-backend-fastapi, test-frontend-react, test-frontend-vue]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build